<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=v=>String(v===undefined||v===null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v?v.split('-').reverse().join('/'):'—';
const usuarios=['Rocío Albarracín','Laura Sánchez','Cecilia Attolini','Andrea Ramat','Mara Torres'];
const S={usuaria:'',meta:null,tablero:null,ficha:null,vista:'tablero',editando:null,manuales:[],analisis:null,busy:false,filtros:{},revision:0,analisisRevision:-1};
let dialogCallback=null, avisoTimer=null,consulta=0;
function opciones(lista,valor,placeholder){return (placeholder===undefined?'':'<option value="">'+esc(placeholder)+'</option>')+lista.map(x=>'<option '+(x===valor?'selected':'')+' value="'+esc(x)+'">'+esc(x)+'</option>').join('');}
function aviso(msg,error){$('#aviso').textContent=msg;$('#aviso').className=error?'error':'';$('#aviso').hidden=false;clearTimeout(avisoTimer);avisoTimer=setTimeout(()=>$('#aviso').hidden=true,error?14000:5000);}
function ocupado(valor){S.busy=valor;$('#progreso').hidden=!valor;$$('button').forEach(b=>{if(valor){b.dataset.preDisabled=b.disabled?'1':'0';b.disabled=true;}else{b.disabled=b.dataset.preDisabled==='1';delete b.dataset.preDisabled;}});}
function rpc(accion,p={},silencioso=false){
 return new Promise((resolve,reject)=>{
  google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>{const msg=(e&&e.message?e.message:String(e)).replace(/^Error: /,'');if(!silencioso)aviso(msg,true);reject(new Error(msg));}).api(Object.assign({},p,{accion,usuaria:S.usuaria}));
 });
}
async function escritura(accion,p){if(S.busy)return;ocupado(true);try{return await rpc(accion,p);}finally{ocupado(false);}}
async function iniciar(nombre){
 S.usuaria=nombre;ocupado(true);
 try{S.meta=await rpc('inicio');S.tablero=S.meta.tablero;try{sessionStorage.setItem('ufij22_usuaria',nombre);}catch(e){}$('#ingreso').hidden=true;$('#app').hidden=false;$('#sesionNombre').textContent=nombre;$('#fechaHoy').textContent=new Intl.DateTimeFormat('es-AR',{dateStyle:'long',timeZone:'America/Argentina/Buenos_Aires'}).format(new Date(S.meta.hoy+'T12:00:00Z'));S.vista='tablero';renderTablero();}
 finally{ocupado(false);}
}
async function actualizarTablero(silencioso=false){const n=++consulta;const r=await rpc('tablero',{filtros:S.filtros},silencioso);if(n!==consulta||S.vista!=='tablero')return;S.tablero=r;S.meta.hoy=r.hoy;renderTablero();}
function badge(a){return '<span class="badge '+esc(a.nivel)+'">'+esc(a.texto)+'</span>';}
function resumenMedida(m){return '<strong>'+esc(m.descripcion)+'</strong><span class="muted">'+esc(m.organismo)+' · '+esc(m.estado)+(m.principal?' · Prueba principal':'')+(m.necesariaEvaluacion?' · Necesaria para evaluación':'')+'</span>';}
function botonesMedida(m){const cerrada=['Recibida','No corresponde','Dejada sin efecto'].includes(m.estado);return '<div class="acciones">'+(!cerrada?'<button class="pequeno" data-action="reiterar" data-id="'+m.id+'">Reiterada</button><button class="pequeno" data-action="recibir" data-id="'+m.id+'">Recibida</button>':'')+'<button class="pequeno texto" data-action="ficha" data-id="'+m.causaId+'">Abrir ficha →</button></div>';}
function renderTablero(){
 const t=S.tablero,f=S.filtros,porId=new Map(t.causas.map(c=>[c.id,c])),caso=id=>porId.get(id)||t.medidas.find(m=>m.causaId===id)||t.evaluaciones.find(e=>e.causaId===id),k=t.kpi;
 const tarjetas=[['vencidas','Medidas vencidas',k.vencidas],['proximas','Medidas próximas a vencer',k.proximas],['reiteradas','Reiteradas sin respuesta',k.reiteradas],['evaluacion','Prueba principal pendiente de evaluación',k.evaluacion],['limitado','Potencial investigativo limitado',k.limitado],['orac','ORAC pendiente de devolución',k.orac],['camaras','Conservación de cámaras · alerta crítica',k.camaras]];
 const medidas=t.medidas.filter(m=>!['Recibida','No corresponde','Dejada sin efecto'].includes(m.estado)).sort((a,b)=>{const rango={rojo:0,naranja:1,amarillo:2,verde:3,sin:4};return rango[a.alerta.nivel]-rango[b.alerta.nivel]||String(a.alerta.fecha||'').localeCompare(b.alerta.fecha||'');});
 const alertasT=t.evaluaciones||[];
 $('#contenido').innerHTML='<div class="encabezado"><div><p class="eyebrow">SEGUIMIENTO COMPARTIDO</p><h1>Tablero de causas</h1><p>Prioridades del equipo y próximos controles.</p></div><button data-action="actualizar">↻ Actualizar</button></div><div class="kpis">'+tarjetas.map(([id,label,n])=>'<button class="kpi" data-action="kpi" data-key="'+id+'"><strong>'+n+'</strong><span>'+label+'</span></button>').join('')+'</div>'+
 '<section class="panel"><form id="filtros"><div class="filtros"><label>Buscar IPP<input name="ipp" type="search" placeholder="Número de IPP" value="'+esc(f.ipp||'')+'"></label><label>Instructora<select name="instructora">'+opciones(usuarios,f.instructora,'Todas')+'</select></label><label>Investigación<select name="tipo">'+opciones(Object.keys(S.meta.campos),f.tipo,'Todas')+'</select></label><label>Resultado<select name="resultado">'+opciones(['Lesiones culposas','Homicidio culposo'],f.resultado,'Todos')+'</select></label><label>Estado de causa<select name="estado">'+opciones(S.meta.estados,f.estado,'Todos')+'</select></label></div><div class="checks">'+[['evaluacion','Evaluación 308 / Desestimación'],['orac','ORAC pendiente'],['vencidas','Medidas vencidas'],['reiteradas','Reiteradas'],['limitado','Potencial limitado'],['camaras','Cámaras: riesgo crítico']].map(([name,label])=>'<label class="check"><input type="checkbox" name="'+name+'" '+(f[name]?'checked':'')+'>'+label+'</label>').join('')+'<button class="pequeno" type="submit">Aplicar filtros</button><button class="pequeno texto" type="button" data-action="limpiarFiltros">Limpiar</button></div></form><p class="muted" style="margin:12px 0 0">'+t.totalCausas+' causas · Indicadores según filtros activos'+(f.proximas?' · Vista de medidas próximas a vencer':'')+'</p></section>'+
 '<section class="panel"><div class="seccion-titulo"><h2>Medidas que requieren seguimiento</h2><small>Control: '+fmt(t.hoy)+'</small></div><div class="tabla-scroll"><table><thead><tr><th>IPP / Instructora</th><th>Medida</th><th>Control</th><th>Acciones rápidas</th></tr></thead><tbody>'+medidas.filter(m=>!f.proximas||m.alerta.nivel==='amarillo').map(m=>'<tr><td><strong>'+esc(caso(m.causaId).ipp)+'</strong><span class="muted">'+esc(caso(m.causaId).instructora)+'</span></td><td>'+resumenMedida(m)+'</td><td>'+badge(m.alerta)+'<span class="muted">'+fmt(m.alerta.fecha)+'</span></td><td>'+botonesMedida(m)+'</td></tr>').join('')+'</tbody></table>'+(medidas.length?'':'<div class="vacio">No hay medidas pendientes para estos filtros.</div>')+'</div>'+paginador(t.paginas.medidas,'paginaMedidas')+'</section>'+
 ((alertasT.length||f.evaluacion)?'<section class="panel panel-evaluacion"><h2>CAUSAS PENDIENTES DE EVALUACIÓN 308 / DESESTIMACIÓN</h2><div class="tabla-scroll"><table><thead><tr><th>IPP / Instructora</th><th>Ingreso / días transcurridos</th><th>Alerta de evaluación interna</th><th>Acciones</th></tr></thead><tbody>'+alertasT.map(a=>'<tr><td><strong>'+esc(a.ipp)+'</strong><span class="muted">'+esc(a.instructora)+'</span></td><td>'+fmt(a.fechaIngresoEvaluacion||a.fechaCreacion)+'<span class="muted">'+a.diasTranscurridos+' días corridos</span></td><td>'+badge(a.alerta)+'</td><td><div class="acciones"><button class="pequeno" data-action="controlEvaluacionTablero" data-id="'+a.id+'">Registrar control</button><button class="pequeno" data-action="cumplirEvaluacionTablero" data-id="'+a.id+'">Evaluación cumplida</button><button class="pequeno texto" data-action="ficha" data-id="'+a.causaId+'">Abrir ficha →</button></div></td></tr>').join('')+'</tbody></table>'+(!alertasT.length?'<div class="vacio">No hay evaluaciones activas para estos filtros.</div>':'')+'</div>'+paginador(t.paginas.evaluaciones,'paginaEvaluaciones')+'</section>':'')+
 (t.camarasCriticas.length?'<section class="panel"><h2>Conservación urgente de videofilmaciones</h2>'+t.camarasCriticas.map(c=>'<p><button class="texto" data-action="ficha" data-id="'+c.id+'">'+esc(c.ipp)+'</button> '+badge(c.camarasAlerta)+' <small>Referencia: '+fmt(c.camarasAlerta.fecha)+'</small></p>').join('')+'</section>':'')+
 '<section class="panel"><h2>Causas</h2><div class="tabla-scroll"><table><thead><tr><th>IPP</th><th>Investigación / resultado</th><th>Responsable</th><th>Situación</th><th>ORAC</th><th></th></tr></thead><tbody>'+t.causas.map(c=>'<tr><td><strong>'+esc(c.ipp)+'</strong><span class="muted">Sumario: '+fmt(c.fechaSumario)+'</span></td><td>'+esc(c.tipo)+'<span class="muted">'+esc(c.resultado)+'</span></td><td>'+esc(c.instructora)+'</td><td>'+esc(c.estado)+(c.potencial?'<span class="muted">Potencial: '+esc(c.potencial)+'</span>':'')+'</td><td>'+esc(c.oracEstado||'—')+(c.oracEstado&&c.oracEstado!=='Devuelta'?'<br>'+badge(c.oracAlerta):'')+'</td><td><button class="pequeno texto" data-action="ficha" data-id="'+c.id+'">Abrir ficha →</button></td></tr>').join('')+'</tbody></table>'+(t.causas.length?'':'<div class="vacio">Sin causas para mostrar. Iniciá la carga con NUEVA CAUSA.</div>')+'</div>'+paginador(t.paginas.causas,'paginaCausas')+'</section><div class="leyenda"><span class="badge rojo">Vencida / segunda alerta</span><span class="badge naranja">Primera alerta</span><span class="badge amarillo">Próxima a vencer</span><span class="badge verde">Dentro de plazo</span><span class="badge azul">Evaluación pendiente</span></div>';
 $('#actualizado').textContent='Última actualización: '+new Intl.DateTimeFormat('es-AR',{timeStyle:'short',timeZone:'America/Argentina/Buenos_Aires'}).format(new Date());
}
function paginador(info,campo){return info.total>100?'<div class="paginacion"><button class="pequeno" data-action="pagina" data-campo="'+campo+'" data-numero="'+Math.max(0,info.pagina-1)+'" '+(info.pagina===0?'disabled':'')+'>Anterior</button><span>Página '+(info.pagina+1)+' de '+info.paginas+' · '+info.total+' registros</span><button class="pequeno" data-action="pagina" data-campo="'+campo+'" data-numero="'+(info.pagina+1)+'" '+(info.pagina+1===info.paginas?'disabled':'')+'>Siguiente</button></div>':'';}
function leerFiltros(){const fd=new FormData($('#filtros')),f={};for(const [k,v] of fd.entries())f[k]=v==='on'?true:v;return f;}
function nueva(c){
 S.vista='formulario';S.editando=c||null;S.analisis=null;S.manuales=[];S.revision=0;S.analisisRevision=-1;
 const v=JSON.parse(JSON.stringify(c||{instructora:S.usuaria,fechaSumario:S.meta.hoy,datos:{}}));
 if(v.tipo==='Mala praxis'&&v.datos.estudiosExcepcionales===undefined)v.datos.estudiosExcepcionales=['autopsia','anatomia'].some(k=>v.datos[k]&&v.datos[k]!=='No corresponde');
 if(v.tipo!=='Mala praxis'&&!v.datos.preservacion)v.datos.preservacion=v.datos.camaras==='Recibidas'?'Videofilmaciones recibidas':'No consta solicitud de preservación';
 const p=(v.principalTipo||'').startsWith('Otra: ')?'Otra':v.principalTipo;
 $('#contenido').innerHTML='<div class="encabezado"><div><p class="eyebrow">'+(c?'FICHA DE CAUSA':'PRIMER DESPACHO')+'</p><h1>'+(c?'Editar causa':'Nueva causa')+'</h1><p>Completá la plantilla y revisá las medidas antes de confirmar.</p></div><button data-action="'+(c?'cancelarEdicion':'tablero')+'">← Volver</button></div><form id="causaForm"><section class="panel"><h2>1. Datos básicos</h2><div class="grid"><label>IPP<input name="ipp" maxlength="100" required value="'+esc(v.ipp||'')+'"></label><label>Fecha del hecho<input type="date" name="fechaHecho" max="'+S.meta.hoy+'" required value="'+esc(v.fechaHecho||'')+'"></label><label>Recepción del sumario<input type="date" name="fechaSumario" max="'+S.meta.hoy+'" required value="'+esc(v.fechaSumario||'')+'"></label><label>Instructora responsable<select name="instructora" required>'+opciones(usuarios,v.instructora,'Seleccionar')+'</select></label><label>Tipo de resultado<select name="resultado" required>'+opciones(['Lesiones culposas','Homicidio culposo'],v.resultado,'Seleccionar')+'</select></label><label>Tipo de investigación<select name="tipo" required '+(c?'disabled':'')+'>'+opciones(Object.keys(S.meta.campos),v.tipo,'Seleccionar')+'</select></label></div></section><section class="panel"><h2>2. Plantilla de investigación</h2><div id="plantilla"></div><label style="margin-top:20px">Dato relevante / particularidad de la investigación <small>Opcional · hasta 500 caracteres</small><textarea name="dato" rows="2" maxlength="500">'+esc(v.dato||'')+'</textarea></label></section><div class="acciones"><button class="primario" type="submit">'+(c?'GUARDAR CAMBIOS':'REVISAR MEDIDAS Y PROPUESTA →')+'</button></div></form><div id="revision"></div>';
 renderPlantilla(Object.assign({},v,{principalTipo:p,principalOtra:p==='Otra'?v.principalTipo.slice(6):''}));window.scrollTo(0,0);
}
function leerCausa(){
 const form=$('#causaForm'),fd=new FormData(form),get=k=>fd.get(k)||'';
 const c={ipp:get('ipp'),fechaHecho:get('fechaHecho'),fechaSumario:get('fechaSumario'),instructora:get('instructora'),resultado:get('resultado'),tipo:S.editando?S.editando.tipo:get('tipo'),dato:get('dato'),principalTipo:get('principalTipo'),principalOtra:get('principalOtra'),datos:{}};
 (S.meta.campos[c.tipo]||[]).forEach(f=>c.datos[f[0]]=get('d_'+f[0]));
 c.datos.documentacionReunida=fd.get('documentacionReunida')==='on';c.datos.estudiosExcepcionales=fd.get('estudiosExcepcionales')==='on';
 c.datos.listaTestigos=$$('.testigo').map((row,i)=>({id:row.dataset.tid||'testigo-'+(i+1),estado:row.querySelector('[data-w="estado"]').value,hora:row.querySelector('[data-w="hora"]').value,nombre:row.querySelector('[data-w="nombre"]').value,telefono:row.querySelector('[data-w="telefono"]').value,fecha:row.querySelector('[data-w="fecha"]').value}));
 return c;
}
function campoVisible(f,c){return !f[3]||f[3]==='medicoContextual'&&(c.resultado==='Homicidio culposo'||c.datos.estudiosExcepcionales===true)||f[3]==='homicidio'&&c.resultado==='Homicidio culposo'||f[3]==='camaras'&&c.datos.camaras==='Recibidas'||f[3]==='allanamiento'&&['Requiere allanamiento','Requiere secuestro','Ya secuestrada'].includes(c.datos.historia);}
function renderPlantilla(c){
 if(c.tipo!=='Mala praxis'&&!c.datos.preservacion)c.datos.preservacion=c.datos.camaras==='Recibidas'?'Videofilmaciones recibidas':'No consta solicitud de preservación';
 const fs=S.meta.campos[c.tipo];if(!fs){$('#plantilla').innerHTML='<p class="muted">Seleccioná el tipo de investigación.</p>';return;}
 let html=(c.tipo==='Mala praxis'&&c.resultado!=='Homicidio culposo'?'<label class="check" style="margin-bottom:18px"><input type="checkbox" name="estudiosExcepcionales" '+(c.datos.estudiosExcepcionales?'checked':'')+'>Autopsia / anatomía patológica pertinentes en este supuesto excepcional</label>':'')+'<div class="grid">'+fs.filter(f=>campoVisible(f,c)).map(f=>'<label>'+esc(f[1])+'<select required name="d_'+f[0]+'">'+opciones(f[2],c.datos[f[0]],'Seleccionar')+'</select></label>').join('');
 if(c.tipo==='Otros')html+='<label>Prueba principal<select required name="principalTipo">'+opciones(['Pericia de seguridad e higiene','Pericia mecánica','Informe técnico','Otra'],c.principalTipo,'Seleccionar')+'</select></label>'+(c.principalTipo==='Otra'?'<label>Especificar prueba principal<input name="principalOtra" maxlength="120" required value="'+esc(c.principalOtra||'')+'"></label>':'');
 html+='</div>';
 if(c.tipo==='Mala praxis')html+='<p class="nota">La investigación culmina en una pericia médica. No se calcula potencial investigativo. Si la historia ya fue secuestrada, verificá que esté completa antes de marcar documentación reunida.</p><label class="check"><input name="documentacionReunida" type="checkbox" '+(c.datos.documentacionReunida?'checked':'')+'>Confirmo que la documentación necesaria está reunida y completa.</label>';
 if(c.datos.testigos==='Sí'){
 const ts=c.datos.listaTestigos||[];
 html+='<div style="margin-top:22px"><h3>Testigos presenciales</h3><p class="muted">Podés continuar sin individualizarlos. Agregá los datos cuando estén disponibles. Si la audiencia ya está registrada, actualizá su fecha y cumplimiento desde Tareas de la ficha.</p>'+ts.map((t,i)=>'<div class="testigo" data-tid="'+esc(t.id||'testigo-'+(i+1))+'"><label>Nombre y apellido (opcional)<input data-w="nombre" maxlength="150" value="'+esc(t.nombre)+'"></label><label>Teléfono (opcional)<input data-w="telefono" type="tel" maxlength="60" value="'+esc(t.telefono)+'"></label><label>Audiencia (si está designada)<input data-w="fecha" type="date" value="'+esc(t.fecha)+'"></label><label>Hora (opcional)<input data-w="hora" type="time" value="'+esc(t.hora||'')+'"></label><label>Situación<select data-w="estado">'+opciones(['Individualización pendiente','Individualizado','Audiencia designada','Declaración recibida'],t.estado||(t.fecha?'Audiencia designada':t.nombre?'Individualizado':'Individualización pendiente'))+'</select></label><button type="button" data-action="quitarTestigo" data-index="'+i+'" aria-label="Quitar testigo">×</button></div>').join('')+'<button type="button" data-action="agregarTestigo">＋ Agregar testigo</button></div>';
 }
 $('#plantilla').innerHTML=html;
}
function invalidar(){S.revision++;if($('#revision'))$('#revision').innerHTML='';S.analisis=null;}
function renderRevision(){
 const a=S.analisis,c=leerCausa();
 $('#revision').innerHTML='<section class="panel" style="margin-top:25px"><h2>3. Resumen y medidas propuestas</h2><div class="resumen"><div><small>IPP</small><strong>'+esc(c.ipp)+'</strong></div><div><small>Investigación</small>'+esc(c.tipo)+' · '+esc(c.resultado)+'</div><div><small>Responsable</small>'+esc(c.instructora)+'</div>'+(a.potencial?'<div><small>Potencial investigativo</small><span class="badge '+(a.potencial==='Identificado'?'verde':a.potencial==='Limitado'?'naranja':'amarillo')+'">'+esc(a.potencial)+'</span></div>':'')+'</div>'+(a.camarasAlerta&&a.camarasAlerta.nivel!=='sin'?'<p class="nota">'+badge(a.camarasAlerta)+'<br><small>Conservación de referencia desde el hecho: '+fmt(a.camarasAlerta.fecha)+'. La solicitud de imágenes no acredita su preservación.</small></p>':'')+'<p class="nota">Seleccioná las medidas y tareas que se ordenarán. El seguimiento se activa únicamente al confirmar el despacho.</p><label>Fecha de solicitud para medidas sugeridas<input id="fechaDespacho" type="date" value="'+S.meta.hoy+'" max="'+S.meta.hoy+'" required></label><div id="sugerencias">'+a.sugerencias.map((m,i)=>'<div class="sugerencia"><label class="check"><input type="checkbox" data-sugerencia="'+i+'" checked><span>'+esc(m.descripcion)+'<small>'+(m.clase==='tarea'?'Tarea interna'+(m.fechaAudiencia?' · Audiencia: '+fmt(m.fechaAudiencia):''):esc(m.organismo)+' · '+m.plazo+' días corridos')+(m.principal?' · Prueba principal':'')+(m.necesariaEvaluacion?' · Necesaria para evaluación':'')+'</small></span></label></div>').join('')+(a.sugerencias.length?'':'<p class="muted">No hay sugerencias para esta carga. Podés agregar medidas manuales.</p>')+'</div><div id="manuales"></div><button data-action="manualBorrador" style="margin-top:15px">＋ AGREGAR MEDIDA</button></section><section class="panel"><div class="seccion-titulo"><h2>4. Propuesta de primer despacho</h2><button data-action="regenerar">Regenerar propuesta</button></div><p class="muted">Proyecto editable, sujeto a revisión de la instructora y de la Fiscal antes de copiar a SIMP. No se guarda en esta aplicación.</p><textarea id="despacho" class="despacho" aria-label="Propuesta de despacho"></textarea><div class="acciones"><button data-action="copiar">Copiar texto</button><button data-action="confirmar" class="primario">CONFIRMAR DESPACHO Y ACTIVAR SEGUIMIENTO</button></div></section>';
 renderManuales();generarDespacho();$('#revision').scrollIntoView({behavior:'smooth',block:'start'});
}
function elegidas(){return $$('[data-sugerencia]:checked').map(el=>S.analisis.sugerencias[Number(el.dataset.sugerencia)]);}
function renderManuales(){$('#manuales').innerHTML=S.manuales.map((m,i)=>'<div class="sugerencia"><strong>'+esc(m.descripcion)+'</strong><small> · '+esc(m.organismo)+' · '+m.plazo+' días'+(m.principal?' · Principal':'')+'</small> <button class="pequeno texto" data-action="quitarManual" data-index="'+i+'">Quitar</button></div>').join('');}
const etiquetasMedida={PERSONALIZADA:'Medida personalizada',RML:'Reconocimiento médico legal',CRIP:'CRIP',HISTORIA_CLINICA:'Historia clínica',INFORME_TRANSITO:'Informe de Tránsito',PRESERVAR_CAMARAS:'Preservación de videofilmaciones',CAMARAS:'Remisión de videofilmaciones',INDIVIDUALIZAR:'Individualización de testigos',INSPECCION:'Inspección técnica',DOCUMENTACION_TECNICA:'Documentación técnica / administrativa',FECHA_MEDICA:'Fecha de pericia médica',FECHA_ACCIDENTOLOGICA:'Fecha de pericia accidentológica',DICTAMEN_MEDICO:'Dictamen médico principal',DICTAMEN_ACCIDENTOLOGICO:'Dictamen accidentológico principal',AMPLIACION_MEDICA:'Ampliación de pericia médica',ESPECIALISTA:'Pericia por especialista',PRINCIPAL_OTROS:'Prueba principal de Otros'};
function opcionesMedida(){return S.meta.tiposMedida.map(k=>'<option value="'+k+'">'+esc(etiquetasMedida[k]||k)+'</option>').join('');}

function abrirDialogo(titulo,html,callback,peligro=false){$('#dialogTitulo').textContent=titulo;$('#dialogCuerpo').innerHTML=html;dialogCallback=callback;$('#dialogConfirmar').className=peligro?'peligro':'primario';$('#dialogo').showModal();}
function datosDialogo(form){const fd=new FormData(form),o={};for(const [k,v]of fd.entries())o[k]=v==='on'?true:v;return o;}
async function mostrarFicha(id){S.ficha=await rpc('ficha',{id});S.vista='ficha';renderFicha();window.scrollTo(0,0);}
function aplicarFicha(f){if(!f)return;S.ficha=f;S.vista='ficha';renderFicha();}
function renderFicha(){
 const f=S.ficha,c=f.causa,stage=c.periciaEstado;
 const pasos=['Sin iniciar','Fecha solicitada','Fecha otorgada','Pericia designada','Pericia realizada / dictamen pendiente','Dictamen recibido'];
 let pericia='';

 let orac='';if(c.tipo==='Tránsito'&&(c.potencial==='Identificado'||c.oracEstado))orac='<section class="panel"><div class="seccion-titulo"><h2>ORAC</h2>'+badge(c.oracAlerta)+'</div><div class="resumen"><div><small>Estado</small>'+esc(c.oracEstado||'Sin remisión')+'</div><div><small>Remisión</small>'+fmt(c.oracFecha)+'</div><div><small>Primera alerta</small>'+fmt(c.oracPrimera)+'</div><div><small>Última gestión / segunda alerta</small>'+fmt(c.oracReiteracion)+' / '+fmt(c.oracSegunda)+'</div><div><small>Devolución</small>'+fmt(c.oracDevolucion)+'</div></div><div class="acciones">'+(!c.oracEstado||c.oracEstado==='Devuelta'?'<button data-action="orac" data-paso="remitir">Remitir a ORAC</button>':'<button data-action="orac" data-paso="tramite">En trámite</button><button data-action="orac" data-paso="reiterar">Registrar gestión / reiteración</button><button data-action="orac" data-paso="devolver">Registrar devolución</button>')+'</div></section>';
 const campos=S.meta.campos[c.tipo].filter(x=>campoVisible(x,c));
 $('#contenido').innerHTML='<div class="encabezado"><div><p class="eyebrow">FICHA DE CAUSA</p><h1>IPP '+esc(c.ipp)+'</h1><p>'+esc(c.tipo)+' · '+esc(c.resultado)+' · '+esc(c.instructora)+'</p></div><div><button data-action="tablero">← Tablero</button> <button data-action="editar">Editar causa</button></div></div><section class="panel"><div class="resumen"><div><small>Estado</small><strong>'+esc(c.estado)+'</strong></div><div><small>Fecha del hecho</small>'+fmt(c.fechaHecho)+'</div><div><small>Recepción sumario</small>'+fmt(c.fechaSumario)+'</div>'+(c.potencial?'<div><small>Potencial investigativo</small>'+esc(c.potencial)+'</div>':'')+'<div><small>Prueba principal</small>'+esc(c.principalTipo)+'<br><span class="badge '+(c.principalRecibida?'azul':'sin')+'">'+(c.principalRecibida?'Recibida':'Pendiente')+'</span></div></div>'+(c.dato?'<p class="nota">'+esc(c.dato)+'</p>':'')+'<details><summary>Ver triaje y datos de origen</summary><div class="grid" style="margin-top:18px">'+campos.map(x=>'<div><small>'+esc(x[1])+'</small><div>'+esc(c.datos[x[0]])+'</div></div>').join('')+'</div>'+(c.datos.listaTestigos||[]).map(t=>'<p>'+esc(t.nombre)+' · '+esc(t.telefono||'Sin teléfono')+' · Audiencia '+fmt(t.fecha)+'</p>').join('')+'</details></section>'+renderNuevasDiligencias(f)+(c.camarasAlerta.nivel!=='sin'?'<section class="panel"><h2>Conservación de cámaras</h2>'+badge(c.camarasAlerta)+'<p class="muted">Fecha de referencia: '+fmt(c.camarasAlerta.fecha)+'. No presume destrucción de imágenes. La remisión se controla como medida independiente.</p></section>':'')+pericia+orac+
 '<section class="panel"><div class="seccion-titulo"><h2>Medidas</h2><button data-action="agregarMedida" class="primario">＋ AGREGAR MEDIDA</button></div><div class="tabla-scroll"><table><thead><tr><th>Medida / organismo</th><th>Solicitud / plazo</th><th>Controles</th><th>Recepción</th><th>Acciones</th></tr></thead><tbody>'+f.medidas.map(m=>'<tr><td>'+resumenMedida(m)+'</td><td>'+fmt(m.fechaSolicitud)+'<span class="muted">'+m.plazo+' días corridos</span></td><td>'+badge(m.alerta)+'<span class="muted">1.ª: '+fmt(m.primeraAlerta)+'<br>Reiteración: '+fmt(m.fechaReiteracion)+'<br>2.ª: '+fmt(m.segundaAlerta)+'</span></td><td>'+fmt(m.fechaRecepcion)+'</td><td>'+botonesMedida(m)+'<button class="pequeno texto" data-action="estadoMedida" data-id="'+m.id+'">Cambiar estado</button><button class="pequeno texto" data-action="rolMedida" data-id="'+m.id+'">Rol en evaluación</button></td></tr>').join('')+'</tbody></table>'+(f.medidas.length?'':'<div class="vacio">Sin medidas registradas.</div>')+'</div></section>'+
 '<section class="panel"><div class="seccion-titulo"><h2>Tareas internas</h2><button data-action="agregarTarea">＋ Agregar tarea</button></div><div class="tabla-scroll"><table><thead><tr><th>Tarea</th><th>Estado / fechas</th><th>Alerta</th><th>Acciones</th></tr></thead><tbody>'+f.tareas.map(t=>'<tr><td><strong>'+esc(t.tipo)+'</strong><span class="muted">'+esc(t.descripcion)+'</span></td><td>'+esc(t.estado)+(t.fechaAudiencia?'<span class="muted">Audiencia: '+fmt(t.fechaAudiencia)+'</span>':'')+'</td><td>'+badge(t.alerta)+(t.primeraAlerta&&!t.evaluacionSuspendida?'<span class="muted">1.ª: '+fmt(t.primeraAlerta)+'<br>2.ª: '+fmt(t.segundaAlerta)+'</span>':'')+'</td><td><div class="acciones">'+(t.estado==='Pendiente'&&!t.evaluacionSuspendida?'<button class="pequeno" data-action="cumplirTarea" data-id="'+t.id+'">'+(t.tipo==='Evaluación 308 / Desestimación'?'Cerrar evaluación':'Cumplida')+'</button>':t.estado==='Cumplida'?'<button class="pequeno" data-action="reabrirTarea" data-id="'+t.id+'">Reabrir</button>':'<span class="muted">Esperando prueba necesaria</span>')+(t.tipo==='Audiencia testimonial'?'<button class="pequeno" data-action="fechaTarea" data-id="'+t.id+'">Fecha de audiencia</button>':'')+(t.tipo==='Evaluación 308 / Desestimación'&&t.estado==='Pendiente'&&!t.evaluacionSuspendida?'<button class="pequeno" data-action="reiterarTarea" data-id="'+t.id+'">Registrar control</button>':'')+'</div></td></tr>').join('')+'</tbody></table>'+(f.tareas.length?'':'<div class="vacio">Sin tareas internas.</div>')+'</div></section>'+
 '<section class="panel"><details><summary>Bitácora de actuaciones</summary><button class="pequeno" data-action="cargarBitacora">Cargar historial</button><div id="historialCompleto"></div></details><div class="acciones"><button data-action="estadoCausa">Cambiar estado de causa</button><button data-action="eliminar" class="peligro">Eliminar causa definitivamente</button></div>'+(c.ipp.startsWith('FICTICIA-')?'<details><summary>Validación con datos ficticios</summary><p>Envía dos modificaciones simultáneas con la misma versión. Debe aceptar una y rechazar la desactualizada.</p><button data-action="probarConcurrencia">Probar concurrencia real en Apps Script</button></details>':'')+'</section>';
}
function renderNuevasDiligencias(f){
 if(!f.sugerencias.length)return '';
 return '<section class="panel"><h2>Nuevas diligencias propuestas</h2><p class="muted">Se recalculan según la información actual. Ninguna medida existente se modifica. Desmarcá las que no quieras ordenar en esta revisión.</p>'+f.sugerencias.map((m,i)=>'<div class="sugerencia"><label class="check"><input type="checkbox" data-nueva="'+i+'" checked><span>'+esc(m.descripcion)+'<small>'+(m.clase==='tarea'?'Tarea interna':esc(m.organismo)+' · '+m.plazo+' días corridos')+'</small></span></label></div>').join('')+'<label>Fecha de solicitud<input type="date" id="fechaDespacho" value="'+S.meta.hoy+'" max="'+S.meta.hoy+'" required></label><details><summary>Proyecto de despacho de nuevas diligencias</summary><textarea id="despacho" class="despacho" aria-label="Propuesta de nuevas diligencias"></textarea><button data-action="regenerar">Generar / regenerar proyecto</button><button data-action="copiar">Copiar texto</button></details><div class="acciones"><button data-action="confirmarNuevas" class="primario">CONFIRMAR NUEVAS DILIGENCIAS Y ACTIVAR SEGUIMIENTO</button></div></section>';
}
function medidaPorId(id){return (S.vista==='tablero'?S.tablero.medidas:S.ficha.medidas).find(m=>m.id===id);}
function dialogEstado(m,estado){abrirDialogo('Registrar '+(estado||'estado de medida'),'<p>'+esc(m.descripcion)+'</p>'+(!estado?'<label>Estado<select name="estado">'+opciones(S.meta.estadosMedida,m.estado)+'</select></label>':'<input type="hidden" name="estado" value="'+esc(estado)+'">')+'<label>Fecha de la gestión / recepción<input name="fecha" type="date" value="'+S.meta.hoy+'" max="'+S.meta.hoy+'" required></label>'+(['FECHA_MEDICA','FECHA_ACCIDENTOLOGICA'].includes(m.tipo)?'<label>Fecha otorgada para la pericia (obligatoria al recibir)<input name="fechaPericia" type="date" '+(estado==='Recibida'?'required':'')+'></label>':''),async d=>{const f=await escritura('estadoMedida',Object.assign(d,{id:m.id,version:m.version}));if(S.vista==='tablero')await actualizarTablero();else aplicarFicha(f);aviso('Medida actualizada.');});}
async function accion(b){
 const a=b.dataset.action,id=b.dataset.id,c=S.ficha&&S.ficha.causa;
 if(S.busy)return;
 if(a==='pagina'){S.filtros[b.dataset.campo]=Number(b.dataset.numero);await actualizarTablero();return;}
 if(a==='confirmarNuevas'){
  if(!$('#fechaDespacho').reportValidity())return;
  aplicarFicha(await escritura('confirmarNuevas',{id:c.id,version:c.version,claves:$$('[data-nueva]:checked').map(el=>S.ficha.sugerencias[Number(el.dataset.nueva)].clave),fechaSolicitud:$('#fechaDespacho').value}));aviso('Diligencias confirmadas. Las no seleccionadas quedan disponibles para otra revisión.');return;
 }
 if(a==='cargarBitacora'){
  const pagina=await rpc('bitacora',{id:c.id,...(b.dataset.hasta?{hasta:Number(b.dataset.hasta)}:{})});
  if(b.dataset.hasta)b.remove();else $('#historialCompleto').innerHTML='';
  $('#historialCompleto').insertAdjacentHTML('beforeend','<div class="tabla-scroll"><table><thead><tr><th>Fecha</th><th>Usuaria</th><th>Acción</th><th>Detalle</th></tr></thead><tbody>'+pagina.items.map(x=>'<tr><td>'+esc(x.fechaHora)+'</td><td>'+esc(x.usuaria)+'</td><td>'+esc(x.accion)+'</td><td>'+esc(x.detalle)+'</td></tr>').join('')+'</tbody></table></div>'+(pagina.siguiente?'<button data-action="cargarBitacora" data-hasta="'+pagina.siguiente+'">Ver movimientos anteriores</button>':''));return;
 }
 if(['controlEvaluacionTablero','cumplirEvaluacionTablero'].includes(a)){
  const t=S.tablero.evaluaciones.find(t=>t.id===id),control=a==='controlEvaluacionTablero';
  abrirDialogo(control?'Registrar control de evaluación':'Evaluación cumplida','<p>IPP '+esc(t.ipp)+' · '+esc(t.instructora)+'</p>'+(control?'<label>Fecha de control<input type="date" name="fecha" max="'+S.meta.hoy+'" value="'+S.meta.hoy+'" required></label>':'<label>Estado posterior<select name="estadoCausa">'+opciones(['En seguimiento','Cerrada'],'En seguimiento')+'</select></label>'),async d=>{await escritura('tarea',Object.assign(d,{id:t.id,version:t.version,operacion:control?'reiterar':'estado',estado:'Cumplida'}));await actualizarTablero();});return;
 }
 if(a==='cerrarDialogo'){$('#dialogo').close();return;}
 if(a==='salir'){try{sessionStorage.removeItem('ufij22_usuaria');}catch(e){}S.usuaria='';S.ficha=null;S.analisis=null;S.manuales=[];$('#contenido').innerHTML='';$('#app').hidden=true;$('#ingreso').hidden=false;return;}
 if(a==='tablero'){S.vista='tablero';await actualizarTablero();return;}
 if(a==='actualizar'){await actualizarTablero();aviso('Base actualizada.');return;}
 if(a==='nueva'){nueva();return;}
 if(a==='ficha'){await mostrarFicha(id);return;}
 if(a==='editar'){nueva(c);return;}
 if(a==='cancelarEdicion'){S.vista='ficha';renderFicha();return;}
 if(a==='limpiarFiltros'){S.filtros={};await actualizarTablero();return;}
 if(a==='kpi'){S.filtros={};S.filtros[b.dataset.key]=true;await actualizarTablero();return;}
 if(['agregarTestigo','quitarTestigo'].includes(a)){const v=leerCausa();if(a==='agregarTestigo')v.datos.listaTestigos.push({id:'t-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),nombre:'',telefono:'',fecha:'',hora:'',estado:'Individualización pendiente'});else v.datos.listaTestigos.splice(Number(b.dataset.index),1);invalidar();renderPlantilla(v);return;}
 if(a==='regenerar'){generarDespacho();aviso('Propuesta regenerada.');return;}
 if(a==='copiar'){const t=$('#despacho');try{await navigator.clipboard.writeText(t.value);aviso('Propuesta copiada. Revisala antes de incorporarla a SIMP.');}catch(e){t.focus();t.select();if(document.execCommand('copy'))aviso('Propuesta copiada.');else aviso('El navegador bloqueó el portapapeles. Texto seleccionado: usá Ctrl+C.',true);}return;}
 if(a==='manualBorrador'){abrirDialogo('Agregar medida al despacho',formMedida(),async d=>{d.plazo=Number(d.plazo);d.principal=d.principal===true;S.manuales.push(d);renderManuales();generarDespacho();});return;}
 if(a==='quitarManual'){S.manuales.splice(Number(b.dataset.index),1);renderManuales();generarDespacho();return;}
 if(a==='confirmar'){
  if(!$('#causaForm').reportValidity()||!$('#fechaDespacho').reportValidity())return;

  const f=await escritura('confirmar',{causa:leerCausa(),claves:elegidas().map(x=>x.clave),manuales:S.manuales,fechaSolicitud:$('#fechaDespacho').value});
  S.analisis=null;S.manuales=[];aplicarFicha(f);aviso('Despacho confirmado. Seguimiento activado.');window.scrollTo(0,0);return;
 }
 if(['reiterar','recibir','estadoMedida'].includes(a)){dialogEstado(medidaPorId(id),a==='reiterar'?'Reiterada':a==='recibir'?'Recibida':null);return;}
 if(a==='rolMedida'){
  const m=medidaPorId(id);abrirDialogo('Rol de la prueba para evaluación','<p>'+esc(m.descripcion)+'</p><label class="check"><input type="checkbox" name="principal" '+(m.principal?'checked':'')+'>Prueba principal</label><label class="check"><input type="checkbox" name="necesariaEvaluacion" '+(m.necesariaEvaluacion?'checked':'')+'>Necesaria para evaluación final</label><p class="muted">El dictamen original y las complementarias médicas conservan su carácter necesario. Para dejar sin efecto una medida, usá Cambiar estado.</p>',async d=>aplicarFicha(await escritura('rolMedida',Object.assign(d,{id:m.id,version:m.version}))));return;
 }
 if(a==='agregarMedida'){abrirDialogo('Agregar medida',formMedida(),async d=>{d.plazo=Number(d.plazo);d.principal=d.principal===true;aplicarFicha(await escritura('agregarMedida',{id:c.id,version:c.version,medida:d}));});return;}
 if(a==='agregarTarea'){abrirDialogo('Agregar tarea interna','<label>Tipo<select name="tipo">'+opciones(['Acta de apertura','Audiencia testimonial','Otra'],'Otra')+'</select></label><label>Descripción<input name="descripcion" maxlength="500" required></label><label>Fecha de audiencia (si corresponde)<input name="fechaAudiencia" type="date"></label>',async d=>aplicarFicha(await escritura('agregarTarea',{id:c.id,version:c.version,tarea:d})));return;}
 if(['cumplirTarea','reabrirTarea','fechaTarea','reiterarTarea'].includes(a)){
  const t=S.ficha.tareas.find(x=>x.id===id),p={id:t.id,version:t.version};
  const html=a==='fechaTarea'?'<label>Fecha de audiencia<input type="date" name="fecha" required value="'+esc(t.fechaAudiencia)+'"></label><label>Hora (opcional)<input type="time" name="hora" value="'+esc(t.horaAudiencia||'')+'"></label>':a==='reiterarTarea'?'<label>Fecha de control<input type="date" name="fecha" required max="'+S.meta.hoy+'" value="'+S.meta.hoy+'"></label>':a==='cumplirTarea'&&t.tipo==='Evaluación 308 / Desestimación'?'<p>Confirmá que la evaluación fue realizada. Las pruebas complementarias pendientes impiden cerrarla.</p><label>Estado posterior de la causa<select name="estadoCausa">'+opciones(['En seguimiento','Cerrada'],'En seguimiento')+'</select></label>':'<p>'+esc(t.descripcion)+' → '+(a==='reabrirTarea'?'Pendiente':'Cumplida')+'</p>';
  abrirDialogo('Actualizar tarea',html,async d=>aplicarFicha(await escritura('tarea',Object.assign(p,d,{operacion:a==='fechaTarea'?'fecha':a==='reiterarTarea'?'reiterar':'estado',estado:a==='reabrirTarea'?'Pendiente':'Cumplida'}))));return;
 }
 if(a==='pericia'){
  const paso=b.dataset.paso;
  const html=paso==='fecha'?'<label>Fecha otorgada<input name="fecha" type="date" required value="'+esc(c.periciaFecha)+'"></label>':paso==='realizada'?'<label>Fecha de realización<input name="fecha" type="date" max="'+S.meta.hoy+'" value="'+S.meta.hoy+'" required></label><p>Se creará el seguimiento del dictamen como prueba principal.</p>':'<p>Confirmar: '+(paso==='solicitar'?'solicitar fecha de pericia':'designar la pericia para el '+fmt(c.periciaFecha))+'.</p>';
  abrirDialogo('Seguimiento de pericia',html,async d=>aplicarFicha(await escritura('pericia',Object.assign(d,{id:c.id,version:c.version,paso}))));return;
 }
 if(a==='orac'){
  const paso=b.dataset.paso;
  abrirDialogo('ORAC · '+({remitir:'Remisión',tramite:'En trámite',reiterar:'Gestión / reiteración',devolver:'Devolución'}[paso]),'<label>Fecha<input name="fecha" type="date" required max="'+S.meta.hoy+'" value="'+S.meta.hoy+'"></label>'+(paso==='remitir'?'<label class="check"><input name="consentimiento" type="checkbox" required>Confirmo consentimiento de la/s víctima/s para remitir a ORAC.</label>':''),async d=>aplicarFicha(await escritura('orac',Object.assign(d,{id:c.id,version:c.version,operacion:paso}))));return;
 }
 if(a==='estadoCausa'){abrirDialogo('Estado de causa','<label>Estado<select name="estado">'+opciones(['En seguimiento','Cerrada'],c.estado)+'</select></label><p class="muted">La evaluación pendiente se cierra desde su tarea. No puede cerrarse una causa con seguimiento pendiente.</p>',async d=>aplicarFicha(await escritura('estadoCausa',Object.assign(d,{id:c.id,version:c.version}))));return;}
 if(a==='eliminar'){
  abrirDialogo('Eliminar causa definitivamente','<p><strong>Esta acción eliminará la causa, sus medidas, tareas y bitácora asociada. ¿Desea continuar?</strong></p><p>La bitácora de esta causa también se elimina. Conservá una copia de seguridad si corresponde.</p><label>Para confirmar, escribí la IPP: '+esc(c.ipp)+'<input name="confirmacion" required autocomplete="off"></label>',async d=>{if(d.confirmacion!==c.ipp)throw new Error('La IPP no coincide.');await escritura('eliminar',Object.assign(d,{id:c.id,version:c.version}));S.ficha=null;S.vista='tablero';await actualizarTablero();aviso('Causa eliminada definitivamente.');},true);return;
 }
 if(a==='probarConcurrencia'){
  ocupado(true);try{const crear=n=>rpc('agregarTarea',{id:c.id,version:c.version,tarea:{tipo:'Otra',descripcion:'PRUEBA CONCURRENCIA '+n}},true);const r=await Promise.allSettled([crear('A'),crear('B')]);const ok=r.filter(x=>x.status==='fulfilled').length,conf=r.filter(x=>x.status==='rejected'&&/Otra usuaria/.test(x.reason.message)).length;await mostrarFicha(c.id);aviso(ok===1&&conf===1?'Concurrencia verificada: una escritura guardada y otra rechazada por versión desactualizada.':'Resultado inesperado. Revisá la bitácora y la configuración.',!(ok===1&&conf===1));}finally{ocupado(false);}return;
 }
}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b){e.preventDefault();accion(b).catch(e=>aviso(e.message,true));}});
document.addEventListener('submit',async e=>{
 e.preventDefault();const form=e.target;if(S.busy)return;
 try{
  if(form.id==='login'){await iniciar($('#usuaria').value);return;}
  if(form.id==='filtros'){S.filtros=leerFiltros();await actualizarTablero();return;}
  if(form.id==='causaForm'){
   const c=leerCausa();if(S.editando){aplicarFicha(await escritura('editar',{id:S.editando.id,version:S.editando.version,causa:c}));aviso('Cambios guardados. Revisá las nuevas diligencias propuestas; se activan solo al confirmarlas.');}
   else{ocupado(true);try{S.analisis=await rpc('analizar',{causa:c});S.analisisRevision=S.revision;renderRevision();}finally{ocupado(false);}}return;
  }
  if(form.id==='dialogForm'){await dialogCallback(datosDialogo(form));$('#dialogo').close();}
 }catch(err){aviso(err.message,true);}
});
document.addEventListener('input',e=>{if(e.target.closest('#causaForm'))invalidar();});
document.addEventListener('change',e=>{
 const target=e.target;if(target.closest('#dialogForm')&&target.name==='tipo'&&$('#dialogForm [name=plazo]')){const tipo=target.value;$('#dialogForm [name=plazo]').value=S.meta.config[tipo]===undefined?S.meta.config.GENERAL:S.meta.config[tipo];$('#dialogForm [name=naturaleza]').value=tipo==='AMPLIACION_MEDICA'?'Ampliación':tipo==='ESPECIALISTA'?'Nueva pericia':'Requerimiento';$('#dialogForm [name=necesariaEvaluacion]').checked=['AMPLIACION_MEDICA','ESPECIALISTA','DICTAMEN_MEDICO','DICTAMEN_ACCIDENTOLOGICO'].includes(tipo);}
 if(target.closest('#causaForm')){
  invalidar();if(['tipo','resultado','d_camaras','d_preservacion','d_testigos','d_historia','principalTipo','estudiosExcepcionales'].includes(target.name)){const c=leerCausa();if(target.name==='tipo'){c.datos={};c.principalTipo='';}if(target.name==='d_camaras'&&c.datos.camaras==='Recibidas')c.datos.preservacion='Videofilmaciones recibidas';if(target.name==='d_camaras'&&c.datos.camaras!=='Recibidas'&&c.datos.preservacion==='Videofilmaciones recibidas')c.datos.preservacion='No consta solicitud de preservación';if(target.name==='d_preservacion'&&c.datos.preservacion==='Videofilmaciones recibidas')c.datos.camaras='Recibidas';renderPlantilla(c);}
 }
 if(target.matches('[data-sugerencia],[data-nueva],#fechaDespacho'))generarDespacho();
 if(target.closest('#filtros')&&target.type!=='search'){S.filtros=leerFiltros();actualizarTablero().catch(()=>{});}
});
setInterval(()=>{if(S.usuaria&&S.vista==='tablero'&&!S.busy&&!$('#dialogo').open&&!$('#filtros').contains(document.activeElement))actualizarTablero(true).catch(()=>{$('#actualizado').textContent='Sin conexión: actualizar al restablecerse.';});},60000);
try{const guardada=sessionStorage.getItem('ufij22_usuaria');if(usuarios.includes(guardada))iniciar(guardada).catch(()=>{});}catch(e){}
</script>
